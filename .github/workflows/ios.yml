name: iOS build

# Builds the phone app for iPhone here, without EAS: `expo prebuild` makes the native project from app.config.ts
# (it is never committed), xcodebuild archives it and exports it for the App Store, and the result goes to
# TestFlight (or stays as the run's artifact). Signing is automatic: Xcode asks Apple for the profiles of the app and
# its share extension with the App Store Connect API key. The one development certificate it signs the archive with
# is kept as a secret and put in the runner's keychain: left to make one, Xcode made a new certificate on every
# runner (each a fresh machine, the key gone with it) until the account ran out of them.
# Production only: testers get builds through TestFlight. Each run on main with `release` = fix/feature/major first
# raises the iPhone's version (apps/mobile/versions.json's ios), commits it and tags ios-v<version> on main, as the
# desktop app's release does; the Android build raises its own. A branch builds the current version.
# Runs only by hand (Actions → Run workflow). See apps/mobile/README.md, "iOS on GitHub Actions".
#
# Secrets (repository settings, never in the repo):
#   APPLE_TEAM_ID: the Apple Developer team that owns the managed app's bundle id
#   ASC_API_KEY_ID, ASC_API_ISSUER_ID, ASC_API_KEY_P8: an App Store Connect API key (its id, the issuer id and the
#     .p8 file's text) with the Admin role, which automatic signing needs
# Variable: IOS_BUNDLE_ID, the managed app's registered iOS bundle id (for example app.tich.rooms).
#   IOS_DEV_CERT_P12, IOS_DEV_CERT_PASSWORD: the development certificate with its private key (a .p12, base64) and
#     its password. Without them a run still signs, making a certificate of its own (which piles up on the account).
# Variable (optional): IOS_BUILD_NUMBER_BASE, added to the run number (above the last build in App Store Connect).
# A secret still set to PLACEHOLDER (made so the names exist) counts as not set.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Send to TestFlight"
        type: boolean
        default: true
      release:
        description: "fix = 0.0.x, feature = 0.x.0, major = x.0.0; none = build the current version (a branch always does)"
        type: choice
        options: [fix, feature, major, none]
        default: fix
      notes:
        description: "Release notes (optional; default = commit subjects since the last release)"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Before any build, so a failed bump costs no build minutes. On main with `release` = fix/feature/major the version
  # goes up (apps/mobile/versions.json's ios, the other store's untouched), committed and tagged ios-v<version>
  # on main, as the desktop app's (desktop.yml); elsewhere, with none, or a build kept as an artifact (no upload), the build carries the current version.
  version:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      ref: ${{ steps.version.outputs.ref }}
    steps:
      # main only takes pull requests; the release's deploy key is the one push the ruleset lets through.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - id: version
        uses: ./.github/actions/mobile-version
        with:
          platform: ios
          release: ${{ inputs.upload && inputs.release || 'none' }}
          notes: ${{ inputs.notes }}
          deploy-key-set: ${{ secrets.RELEASE_DEPLOY_KEY != '' }}

  build:
    needs: version
    # CI_RUNNER_MACOS names another macOS runner. The App Store takes only builds made with a current Xcode, and the
    # iPhone Duo's layout (the fold's reserved region, its side controls) needs the iOS 27.1 SDK: Xcode 27 (ADR 0212).
    runs-on: ${{ vars.CI_RUNNER_MACOS || 'xcode-27' }}
    timeout-minutes: 90
    env:
      APP_VARIANT: production
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'app.tich.rooms' }}
      EXPO_PUBLIC_API_URL: https://rooms.tich.app
      APP_PLATFORM: ios
    steps:
      # Fails in seconds, before anything is installed, when the key isn't there.
      - name: Apple secrets are set
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          missing=0
          for name in APPLE_TEAM_ID ASC_API_KEY_ID ASC_API_ISSUER_ID ASC_API_KEY_P8; do
            value=$(printenv "$name" || true)
            if [ -z "$value" ] || [ "$value" = PLACEHOLDER ]; then echo "::error::Secret $name is not set"; missing=1; fi
          done
          if [ "$missing" = 1 ]; then echo "See apps/mobile/README.md, \"iOS on GitHub Actions\"."; exit 1; fi
      # The release's commit (the raised version), or the run's own.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Expo SDK 58 needs Node 22.13 or later; eas.json builds on 24.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The newest Xcode on the runner.
      - name: Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - run: bun install --frozen-lockfile
      - name: Build number
        env:
          BASE: ${{ vars.IOS_BUILD_NUMBER_BASE }}
        run: echo "IOS_BUILD_NUMBER=$(( ${BASE:-0} + GITHUB_RUN_NUMBER ))" >> "$GITHUB_ENV"
      # app.config.ts reads the team, bundle id and build number; the share extension takes the identifier from the app.
      - name: Native project
        working-directory: apps/mobile
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          bunx expo prebuild --platform ios --clean --no-install
          cd ios
          command -v pod > /dev/null || sudo gem install cocoapods --no-document
          pod install
      # Written only now, after the dependencies' install scripts and CocoaPods ran: to the runner's temp folder,
      # outside the checkout, and deleted at the end.
      - name: App Store Connect key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          printf '%s\n' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
      # The kept development certificate in a keychain of the run's own: automatic signing finds it and makes none.
      - name: Signing certificate
        env:
          IOS_DEV_CERT_P12: ${{ secrets.IOS_DEV_CERT_P12 }}
          IOS_DEV_CERT_PASSWORD: ${{ secrets.IOS_DEV_CERT_PASSWORD }}
        run: |
          if [ -z "$IOS_DEV_CERT_P12" ] || [ "$IOS_DEV_CERT_P12" = PLACEHOLDER ]; then
            echo "::warning::IOS_DEV_CERT_P12 is not set: Xcode makes a development certificate for this run."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 16)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$IOS_DEV_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dev.p12"
          security import "$RUNNER_TEMP/dev.p12" -k "$keychain" -P "$IOS_DEV_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dev.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          # Searched before the login keychain; the runner's own keychains stay in the list.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain" | tail -1
      - name: Archive
        working-directory: apps/mobile/ios
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -o pipefail
          workspace=$(ls -d *.xcworkspace | head -1)
          scheme="${workspace%.xcworkspace}"
          # The whole log is long: only its end is shown, here in the run's log, where GitHub masks the secrets
          # (an artifact of the file would carry the team id unmasked).
          xcodebuild archive \
            -workspace "$workspace" -scheme "$scheme" -configuration Release \
            -destination generic/platform=iOS -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_API_KEY_ID" -authenticationKeyIssuerID "$ASC_API_ISSUER_ID" \
            > "$RUNNER_TEMP/archive.log" 2>&1 || { tail -300 "$RUNNER_TEMP/archive.log"; exit 1; }
          tail -20 "$RUNNER_TEMP/archive.log"
          test -d "$RUNNER_TEMP/app.xcarchive"
      # With "Send to TestFlight", Xcode uploads the build itself; without it, the .ipa is written to the folder.
      - name: Export
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          UPLOAD: ${{ inputs.upload }}
        run: |
          destination=export
          if [ "$UPLOAD" = true ]; then destination=upload; fi
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$destination</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_API_KEY_ID" -authenticationKeyIssuerID "$ASC_API_ISSUER_ID"
          if [ "$UPLOAD" = true ]; then
            echo "::notice::Build $IOS_BUILD_NUMBER sent to App Store Connect; it shows in TestFlight once Apple processes it."
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !inputs.upload }}
        with:
          name: ios-${{ env.IOS_BUILD_NUMBER }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 14
          # An .ipa is already compressed.
          compression-level: 0
      - name: Remove the key
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/ExportOptions.plist" "$RUNNER_TEMP/dev.p12"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2> /dev/null || true
